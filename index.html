<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Randomizer App</title>

  <!-- Link to Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Link to custom external CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Link to custom external JavaScript (deferred for DOM readiness) -->
  <script src="script.js" defer></script>
</head>

<body>

  <!-- Header section with page title -->
  <header class="bg-dark text-white text-center py-3">
    <h1>Image Randomizer App</h1>
  </header>

  <!-- Main content container -->
  <main class="container text-center my-4">

    <!-- Image display area: 3 columns, each showing 1 image -->
    <div id="image-display" class="row mb-4">
      <div class="col">
        <img id="img1" src="placeholder.jpg" class="img-fluid rounded shadow" alt="Random Image 1">
      </div>
      <div class="col">
        <img id="img2" src="placeholder.jpg" class="img-fluid rounded shadow" alt="Random Image 2">
      </div>
      <div class="col">
        <img id="img3" src="placeholder.jpg" class="img-fluid rounded shadow" alt="Random Image 3">
      </div>
    </div>

    <!-- User input section: interval input + button -->
    <div id="controls" class="mb-3">
      <!-- Label and input for automatic refresh interval -->
      <label for="refreshInterval" class="form-label">Refresh Interval (ms):</label>
      <input type="number" id="refreshInterval" class="form-control w-25 mx-auto" min="500" max="10000" value="5000">

      <!-- Manual randomize button -->
      <button id="randomizeBtn" class="btn btn-primary mt-2">Randomize Images</button>
    </div>

    <!-- Status display: countdown timer and image update counter -->
    <div id="status" class="mt-3">
      <p id="timer" class="fw-bold">Next refresh in: 0.0s</p>
      <p id="counter">Images changed: 0</p>
    </div>

  </main>

  <!-- Footer with identifying information -->
  <footer class="bg-black text-white text-center py-3 border-top">
    <p>Mahtabin Tushi – 000952184 – 2025</p>
  </footer>

</body>
</html>
